[project]
name = "churn-ml-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.13.0",
    # Not imported directly — pulled in transitively (mlflow -> ... -> cryptography).
    # Pinned to a floor because the container image scan flags CVE-2026-69247 as HIGH
    # in 49.0.0, fixed in 50.0.0. Without a floor here the resolver is free to pick
    # the vulnerable version and the Docker scan fails.
    "cryptography>=50.0.0",
    "fastapi>=0.128.7",
    # Floor raised well above the API we use. The container scan found 18
    # CVEs (7 CRITICAL) in mlflow 3.2.0 — path traversal, arbitrary command
    # execution, credential exfiltration — the last of which is fixed in 3.15.0.
    # A >=2.14.0 floor let the resolver pick any of the vulnerable releases.
    "mlflow>=3.15.0",
    "numpy>=2.2.6",
    "pandera>=0.20.0",
    "pandas>=2.3.3",
    "pydantic>=2.0",
    "prometheus-client>=0.20.0",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "scikit-learn==1.7.2",
    "shap>=0.46.0",
    "scipy>=1.14.0",
    "sqlalchemy>=2.0.0",
    "slowapi>=0.1.9",
    "uvicorn>=0.40.0",
]

[project.optional-dependencies]
# PostgreSQL driver. Not a core dependency because SQLite is the default, but
# required for the documented production configuration — without it, setting
# CHURN_EVENT_STORE_DATABASE_URL to a postgresql:// URL fails at import.
postgres = [
    "psycopg[binary]>=3.1",
]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
churn_system = ["config/settings.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
# Pinned explicitly: CI runs 3.12 while .python-version says 3.10, and without this
# the UP rules would behave differently in the two environments.
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "F", "I",      # baseline: pycodestyle, pyflakes, import sorting
    "B",                # bugbear — catches unguarded zip(), mutable defaults
    "UP",               # pyupgrade
    "C4",               # comprehension simplifications
    "SIM",              # simplifications
    "RET",              # return-statement hygiene
    "PERF",             # obvious performance traps
    "DTZ",              # naive datetimes — model versions are timestamps
    "RUF",              # ruff-native, incl. unused noqa
    "G",                # logging format: no f-strings in log calls
    "T20",              # no stray print() in library code
    "LOG",              # logging misuse
    "PIE", "ISC", "A", "TID",  # currently clean — kept as ratchets
    "S",                # bandit security rules
]
ignore = [
    "E501",     # line length is handled by the formatter
    "S101",     # bare asserts are the point of the test suite
    "RUF012",   # ClassVar annotations add noise on simple singletons
    "PERF203",  # retry/backoff loops need try/except inside the loop by design
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into private helpers, use non-crypto randomness, and shell out.
"tests/**" = ["S311", "SLF001", "S603", "S607"]
# CLI scripts print to stdout on purpose and generate synthetic (non-crypto) data.
"scripts/**" = ["T201", "S311"]
# Alembic migrations are generated-style and reference globals by convention.
"alembic/**" = ["INP001"]
