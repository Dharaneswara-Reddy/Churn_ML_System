# Load balancer for the scaled API replicas.
#
# Compose's built-in DNS round-robin is not a substitute: it has no health
# checking, so it keeps handing out the address of a replica whose /ready is
# failing — and it caches resolutions, so a replica that restarts with a new IP
# keeps receiving traffic at the old one.

worker_processes auto;

events {
    worker_connections 2048;
}

http {
    access_log off;          # the API already logs every request with a request_id
    server_tokens off;       # do not advertise the nginx version

    upstream churn_api {
        # `resolve` is unavailable in open-source nginx, so replicas are found via
        # Docker's embedded DNS at startup. `docker compose up --scale api=N`
        # recreates this container, which re-resolves.
        server api:8000 max_fails=3 fail_timeout=10s;

        # Reuse upstream connections. Without this, every proxied request pays a
        # fresh TCP handshake, which dominates latency for a ~10ms endpoint.
        keepalive 64;
    }

    # Enough for a batch of feature rows; the API enforces its own limit
    # (CHURN_MAX_BODY_BYTES) and returns a structured 413 rather than nginx's page.
    client_max_body_size 8m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # The API's rate limiter reads this. It trusts nginx because
    # FORWARDED_ALLOW_IPS names the compose network; a client-supplied
    # X-Forwarded-For is overwritten here rather than appended, so it cannot be
    # forged to escape per-IP limits.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Model inference is CPU-bound and offloaded to a thread; a batch of several
    # hundred rows can legitimately take a few seconds.
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Retry the next replica when one is unreachable or has already returned a
    # 502/503/504 — but never on a timeout, because a /predict that timed out may
    # already have written its prediction event.
    proxy_next_upstream error http_502 http_503 http_504;
    proxy_next_upstream_tries 2;

    server {
        # 8080, not 80: the container runs unprivileged and cannot bind a
        # privileged port. The host mapping publishes it on 8000.
        listen 8080;

        location / {
            proxy_pass http://churn_api;
        }

        # Prometheus scrapes one replica at random through the balancer, which
        # would make counters appear to jump around. Scrape the replicas directly
        # instead; this endpoint is for humans.
        location /metrics {
            proxy_pass http://churn_api;
            add_header X-Scrape-Warning "load-balanced: scrape replicas directly for per-instance metrics" always;
        }
    }
}
