apiVersion: apps/v1
kind: Deployment
metadata:
  name: churn-api
  namespace: churn
  labels: {app: churn-api}
spec:
  replicas: 2
  selector:
    matchLabels: {app: churn-api}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0     # never drop below the current replica count
      maxSurge: 1
  template:
    metadata:
      labels: {app: churn-api}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      # Longer than the API's own shutdown drain, so in-flight predictions finish
      # and their event writes land before SIGKILL.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: churn-ml-system:latest
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          envFrom:
            - configMapRef: {name: churn-config}
          env:
            - name: CHURN_API_KEY
              valueFrom: {secretKeyRef: {name: churn-secrets, key: api-key}}
            - name: CHURN_ADMIN_API_KEY
              valueFrom: {secretKeyRef: {name: churn-secrets, key: admin-api-key}}
            - name: CHURN_ARTIFACT_SIGNING_KEY
              valueFrom: {secretKeyRef: {name: churn-secrets, key: artifact-signing-key}}
            - name: CHURN_SUBJECT_KEY_SALT
              valueFrom: {secretKeyRef: {name: churn-secrets, key: subject-key-salt}}
            - name: CHURN_EVENT_STORE_DATABASE_URL
              valueFrom: {secretKeyRef: {name: churn-secrets, key: database-url}}
          resources:
            requests: {cpu: "500m", memory: "512Mi"}
            limits:   {cpu: "2000m", memory: "1536Mi"}
          # Liveness: is the process alive. Deliberately NOT /ready — a model that
          # fails to load would otherwise restart the pod forever instead of just
          # leaving it out of the Service.
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness runs a real one-row prediction, so it is both slower and far
          # more meaningful than a port check.
          readinessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          # Startup probe covers slow first model loads without forcing the
          # liveness probe to carry a long initialDelay forever.
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 24        # up to 2 minutes to come up
          volumeMounts:
            - {name: models, mountPath: /app/models, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: logs, mountPath: /app/logs}
      volumes:
        # Read-only on purpose: the process that unpickles the model must not be
        # able to write it.
        - name: models
          persistentVolumeClaim: {claimName: churn-models, readOnly: true}
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
