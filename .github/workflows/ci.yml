name: CI

on:
  push:
    branches: [main]
  pull_request:

# Rapid pushes should not queue redundant runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; jobs opt in to more if they ever need it.
permissions:
  contents: read

env:
  # Tests and CI never touch a real MLflow backend.
  CHURN_MLFLOW_ENABLED: "0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install ruff
        run: pip install ruff

      - name: Ruff
        run: ruff check src tests scripts alembic

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Test the version we develop on (.python-version) and the one we ship
        # in the container. Previously CI ran only 3.12 while local was 3.10.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Pytest with coverage
        run: |
          pytest tests/ \
            --cov=churn_system \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=70

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e ".[dev]"

      - name: Upgrade to head, then downgrade back
        env:
          CHURN_EVENT_STORE_DATABASE_URL: sqlite:///./ci_events.db
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The claims this job checks — concurrent outbox claiming under real MVCC,
    # advisory-lock leader election, JSONB column types, and zero autogenerate
    # drift between the migrations and the ORM — are not observable on SQLite.
    # Without this job those tests skip everywhere and the guarantee silently
    # decays back to "compiles against the dialect".
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: churn
          POSTGRES_PASSWORD: churn
          POSTGRES_DB: churn_events
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U churn -d churn_events"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e ".[dev,postgres]"

      - name: Migrate a live PostgreSQL database, both directions
        env:
          CHURN_EVENT_STORE_DATABASE_URL: postgresql+psycopg://churn:churn@localhost:5432/churn_events
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Integration tests against the live server
        env:
          CHURN_TEST_POSTGRES_URL: postgresql+psycopg://churn:churn@localhost:5432/churn_events
        run: pytest tests/test_postgres_integration.py -v

      - name: Fail if the suite skipped instead of running
        env:
          CHURN_TEST_POSTGRES_URL: postgresql+psycopg://churn:churn@localhost:5432/churn_events
        # A misconfigured URL would make every test skip and the job pass green,
        # which is the exact failure this job exists to prevent.
        run: |
          pytest tests/test_postgres_integration.py -q --no-header -o addopts="" \
            | tee /tmp/pg_result.txt
          grep -qE "[0-9]+ passed" /tmp/pg_result.txt
          if grep -qE "[0-9]+ skipped" /tmp/pg_result.txt; then
            echo "PostgreSQL integration tests skipped — the server was not reachable."
            exit 1
          fi

  smoke-train:
    name: Smoke training
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e ".[dev]"

      - name: Train on a synthetic dataset and verify the artifact
        env:
          CHURN_RAW_DATA_PATH: /tmp/smoke_churn.csv
          CHURN_EXPERIMENTS_DIR: /tmp/churn_experiments_ci
          CHURN_TRAINING_REFERENCE_PATH: /tmp/churn_training_ref_ci.csv
          CHURN_PRODUCTION_MODEL_PATH: /tmp/churn_production_ci/current/model.pkl
          # Bundle verification fails closed, so loading the artifact back needs a
          # key. A fixed throwaway value is correct here: the point is to exercise
          # the real sign-then-verify path, not CHURN_ALLOW_UNSIGNED_MODEL, which
          # would let an unsigned bundle through and prove nothing.
          CHURN_ARTIFACT_SIGNING_KEY: ci-smoke-training-key
          CHURN_SUBJECT_KEY_SALT: ci-smoke-training-salt
        run: |
          python scripts/generate_smoke_csv.py "$CHURN_RAW_DATA_PATH" --rows 400
          python -m churn_system.training.train
          # An exit code of 0 only proves the pipeline did not crash. Load the
          # artifact back and score a row so a broken pickle or a schema drift
          # fails the build. The synthetic labels carry no learnable signal, so the
          # metric floor only catches a catastrophically broken model, not a bad one.
          python scripts/verify_training_artifact.py --min-roc-auc 0.4

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build distributions
        run: |
          pip install build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Build API image
        run: docker build -f Dockerfile -t churn-api:ci .

      - name: Build training image
        run: docker build -f Dockerfile.training -t churn-train:ci .

      - name: Scan API image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: churn-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Audit dependencies for known CVEs
        run: |
          pip install pip-audit
          pip install -e "."
          pip-audit --strict

      - name: Scan repository for vulnerabilities and secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
